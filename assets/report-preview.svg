<svg width="1280" height="620" viewBox="0 0 1280 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Trend Opportunity Radar report preview</title>
  <desc id="desc">A synthetic example showing a direct answer, collection counts, an opportunity recommendation, evidence basis, counterexample, and next validation actions.</desc>
  <defs>
    <linearGradient id="page" x1="40" y1="25" x2="1240" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#EEF4F7"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
    <linearGradient id="head" x1="40" y1="60" x2="1210" y2="175" gradientUnits="userSpaceOnUse"><stop stop-color="#10283A"/><stop offset="1" stop-color="#0F514C"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity=".16"/></filter>
    <style>.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.small{font-size:11px;fill:#64748B}.label{font-size:10px;font-weight:700;letter-spacing:.8px}.body{font-size:13px;fill:#334155}.strong{font-weight:700;fill:#122B39}</style>
  </defs>
  <rect width="1280" height="620" rx="32" fill="#071723"/>
  <g transform="translate(28 24)" filter="url(#shadow)" class="sans">
    <rect width="1224" height="568" rx="22" fill="url(#page)"/><rect width="1224" height="38" rx="22" fill="#DDE7EB"/><rect y="20" width="1224" height="18" fill="#DDE7EB"/>
    <circle cx="22" cy="19" r="5" fill="#FB7185"/><circle cx="39" cy="19" r="5" fill="#FBBF24"/><circle cx="56" cy="19" r="5" fill="#34D399"/><rect x="434" y="10" width="356" height="18" rx="9" fill="#F8FAFC"/><text x="612" y="23" text-anchor="middle" fill="#82939B" font-size="9">Local HTML report · synthetic example</text>
    <g transform="translate(20 54)"><rect width="1184" height="112" rx="18" fill="url(#head)"/><rect x="22" y="18" width="172" height="24" rx="12" fill="#123D4A" stroke="#5EEAD4" stroke-opacity=".7"/><text x="108" y="34" text-anchor="middle" fill="#A5F3FC" class="label">SYNTHETIC · NOT LIVE DATA</text><text x="22" y="72" fill="#F8FAFC" font-size="23" font-weight="750">AI assistant for repetitive customer support in small online shops</text><text x="22" y="96" fill="#A9D5D8" font-size="12">Product-demand validation · X · Standard study</text><g transform="translate(790 20)"><rect width="86" height="64" rx="12" fill="#F8FAFC" fill-opacity=".1"/><text x="14" y="23" fill="#A9D5D8" font-size="9">Observed</text><text x="14" y="49" fill="#F8FAFC" font-size="22" font-weight="750">78</text><rect x="96" width="86" height="64" rx="12" fill="#F8FAFC" fill-opacity=".1"/><text x="110" y="23" fill="#A9D5D8" font-size="9">Unique</text><text x="110" y="49" fill="#F8FAFC" font-size="22" font-weight="750">41</text><rect x="192" width="86" height="64" rx="12" fill="#F8FAFC" fill-opacity=".1"/><text x="206" y="23" fill="#A9D5D8" font-size="9">Sources</text><text x="206" y="49" fill="#F8FAFC" font-size="22" font-weight="750">15</text><rect x="288" width="86" height="64" rx="12" fill="#F8FAFC" fill-opacity=".1"/><text x="302" y="23" fill="#A9D5D8" font-size="9">Counter</text><text x="302" y="49" fill="#F8FAFC" font-size="22" font-weight="750">4</text></g></g>
    <g transform="translate(20 182)"><rect width="1184" height="82" rx="16" fill="#FFFFFF" stroke="#D8E3E8"/><text x="20" y="26" fill="#0F766E" class="label">DIRECT ANSWER</text><text x="20" y="55" fill="#122B39" font-size="18" font-weight="750">Test “organize common questions and draft replies” before attempting fully automated support.</text><rect x="1000" y="21" width="158" height="36" rx="18" fill="#DCFCE7"/><circle cx="1020" cy="39" r="6" fill="#22C55E"/><text x="1036" y="44" fill="#166534" font-size="11" font-weight="700">Worth testing first</text></g>
    <g transform="translate(20 280)"><rect width="742" height="260" rx="18" fill="#FFFFFF" stroke="#D8E3E8"/><text x="20" y="28" fill="#64748B" class="label">OPPORTUNITY 01</text><text x="20" y="59" class="strong" font-size="19">Turn repetitive questions into replies a human can approve</text><rect x="20" y="78" width="702" height="50" rx="12" fill="#EFFAF7"/><text x="34" y="99" fill="#0F766E" font-size="10" font-weight="700">WHO</text><text x="88" y="100" class="body">Small shops handling shipping, returns, and usage questions every day</text><text x="34" y="117" fill="#0F766E" font-size="10" font-weight="700">WHY</text><text x="88" y="118" class="body">Repeated copying appears alongside concern about incorrect automated replies</text><text x="20" y="156" fill="#64748B" class="label">RESEARCH BASIS</text><rect x="20" y="168" width="124" height="28" rx="14" fill="#E0F2FE"/><text x="82" y="186" text-anchor="middle" fill="#075985" font-size="10">repeated questions</text><rect x="152" y="168" width="112" height="28" rx="14" fill="#FEF3C7"/><text x="208" y="186" text-anchor="middle" fill="#92400E" font-size="10">manual copying</text><rect x="272" y="168" width="116" height="28" rx="14" fill="#FEE2E2"/><text x="330" y="186" text-anchor="middle" fill="#991B1B" font-size="10">wrong-answer risk</text><text x="20" y="225" fill="#64748B" class="label">NEXT VALIDATION</text><text x="20" y="248" class="body">Run a one-week test with five target shops; track prep time and rewrite rate.</text></g>
    <g transform="translate(780 280)"><rect width="424" height="260" rx="18" fill="#FFFFFF" stroke="#D8E3E8"/><text x="20" y="28" fill="#64748B" class="label">NEXT ACTIONS</text><g transform="translate(20 44)"><circle cx="10" cy="10" r="10" fill="#14B8A6"/><text x="10" y="14" text-anchor="middle" fill="white" font-size="10" font-weight="700">1</text><text x="32" y="8" class="strong" font-size="13">Build now</text><text x="32" y="26" class="body">Draft replies; never auto-send</text></g><g transform="translate(20 99)"><circle cx="10" cy="10" r="10" fill="#38BDF8"/><text x="10" y="14" text-anchor="middle" fill="white" font-size="10" font-weight="700">2</text><text x="32" y="8" class="strong" font-size="13">Validate next</text><text x="32" y="26" class="body">Which questions need the most editing</text></g><g transform="translate(20 154)"><circle cx="10" cy="10" r="10" fill="#FBBF24"/><text x="10" y="14" text-anchor="middle" fill="white" font-size="10" font-weight="700">3</text><text x="32" y="8" class="strong" font-size="13">Stop if</text><text x="32" y="26" class="body">Most drafts still need major rewrites</text></g><rect x="20" y="205" width="384" height="38" rx="11" fill="#FFF7E6"/><text x="34" y="229" fill="#8A5A12" font-size="11"><tspan font-weight="700">Counterexample:</tspan> templates already cover some low-volume shops.</text></g>
    <text x="612" y="560" text-anchor="middle" fill="#7B8F99" font-size="10">All names, counts, and conclusions are synthetic and illustrate report structure only.</text>
  </g>
</svg>
