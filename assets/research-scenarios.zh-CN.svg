<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">五种研究决策场景</title>
  <desc id="desc">五种具体研究任务：发现商业机会、监测品牌舆情、研究竞品用户、寻找内容机会和验证产品需求。</desc>
  <defs>
    <linearGradient id="bg" x1="30" y1="20" x2="1240" y2="740" gradientUnits="userSpaceOnUse"><stop stop-color="#07111F"/><stop offset="0.55" stop-color="#0A2431"/><stop offset="1" stop-color="#0A3B39"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#8FE7DD" stroke-opacity="0.055"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.34"/></filter>
    <style>
      .sans{font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.card-title{font-size:22px;font-weight:750;fill:#F8FAFC}.question{font-size:14px;fill:#9EC4CB}.label{font-size:11px;font-weight:700;fill:#A5F3FC;letter-spacing:.8px}.micro{font-size:11px;fill:#D5EAED}.decision{font-size:13px;font-weight:700;fill:#F8FAFC}
    </style>
  </defs>
  <rect width="1280" height="760" rx="34" fill="url(#bg)"/><rect width="1280" height="760" rx="34" fill="url(#grid)"/>
  <path d="M0 641C180 579 318 616 492 564C701 501 867 591 1034 600C1128 605 1201 579 1280 548" stroke="#5EEAD4" stroke-opacity="0.13" stroke-width="2"/>
  <g class="sans">
    <rect x="44" y="28" width="174" height="32" rx="16" fill="#0F3442" stroke="#38BDF8" stroke-opacity=".55"/><circle cx="65" cy="44" r="5" fill="#5EEAD4"/><text x="80" y="49" class="label">五种研究场景</text>
    <text x="44" y="91" fill="#F8FAFC" font-size="32" font-weight="760">五种研究场景，一套可复核的工作流</text>
    <text x="44" y="119" fill="#9EC4CB" font-size="14">从平台信号出发，帮助你判断下一步该做什么。</text>
    <text x="1236" y="51" text-anchor="end" fill="#7FC8D0" font-size="13">一个主题 · 一个平台 · 一个业务问题</text>

    <g transform="translate(44 142)" filter="url(#shadow)">
      <rect width="376" height="240" rx="22" fill="#0D2A3A" stroke="#2DD4BF" stroke-opacity=".46"/><text x="20" y="29" class="label">01 · 发现</text><text x="20" y="59" class="card-title">发现商业机会</text><text x="20" y="82" class="question">哪些问题还没被解决，值得先试？</text>
      <g transform="translate(20 101)"><rect width="112" height="34" rx="10" fill="#123B49"/><circle cx="13" cy="17" r="5" fill="#FB7185"/><text x="25" y="21" class="micro">没解决的问题</text><rect y="43" width="112" height="34" rx="10" fill="#123B49"/><circle cx="13" cy="60" r="5" fill="#FBBF24"/><text x="25" y="64" class="micro">现在怎么凑合</text><rect y="86" width="112" height="34" rx="10" fill="#123B49"/><circle cx="13" cy="103" r="5" fill="#38BDF8"/><text x="25" y="107" class="micro">愿意行动的信号</text><path d="M122 60H143M136 53L143 60L136 67" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="153" y="22" width="183" height="76" rx="14" fill="#DDF3F1"/><circle cx="176" cy="47" r="13" fill="#14B8A6"/><path d="M172 47L176 51L183 42" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="197" y="43" fill="#164E52" font-size="11" font-weight="700">值得尝试的机会</text><text x="197" y="63" fill="#49767C" font-size="9">适合谁 · 解决什么 · 怎么先试</text><text x="197" y="80" fill="#49767C" font-size="9">什么算有效 · 何时停止</text></g>
      <rect x="20" y="221" width="336" height="1" fill="#35606A"/><text x="20" y="235" class="decision">你会得到：优先验证的机会</text>
    </g>

    <g transform="translate(452 142)" filter="url(#shadow)">
      <rect width="376" height="240" rx="22" fill="#0D2A3A" stroke="#38BDF8" stroke-opacity=".42"/><text x="20" y="29" class="label">02 · 监测</text><text x="20" y="59" class="card-title">监测品牌舆情</text><text x="20" y="82" class="question">大家在表扬、质疑或求助什么？</text>
      <g transform="translate(20 100)"><rect x="0" y="4" width="112" height="27" rx="9" fill="#153B49"/><circle cx="13" cy="17.5" r="4" fill="#5EEAD4"/><text x="25" y="21" class="micro">用户表扬</text><rect x="0" y="41" width="112" height="27" rx="9" fill="#153B49"/><circle cx="13" cy="54.5" r="4" fill="#FB7185"/><text x="25" y="58" class="micro">用户质疑</text><rect x="0" y="78" width="112" height="27" rx="9" fill="#153B49"/><circle cx="13" cy="91.5" r="4" fill="#FBBF24"/><text x="25" y="95" class="micro">用户求助</text><path d="M122 55H143M136 48L143 55L136 62" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="153" y="9" width="183" height="96" rx="14" fill="#E4F2F6"/><text x="168" y="30" fill="#285163" font-size="10" font-weight="700">关注顺序</text><rect x="168" y="40" width="143" height="18" rx="9" fill="#FEE2E2"/><circle cx="179" cy="49" r="4" fill="#EF4444"/><text x="191" y="53" fill="#7F1D1D" font-size="9">需要回应</text><rect x="168" y="64" width="143" height="18" rx="9" fill="#FEF3C7"/><circle cx="179" cy="73" r="4" fill="#F59E0B"/><text x="191" y="77" fill="#78350F" font-size="9">继续观察</text><rect x="168" y="88" width="104" height="5" rx="2.5" fill="#9FCAD2"/></g>
      <rect x="20" y="221" width="336" height="1" fill="#35606A"/><text x="20" y="235" class="decision">你会得到：需要回应的议题</text>
    </g>

    <g transform="translate(860 142)" filter="url(#shadow)">
      <rect width="376" height="240" rx="22" fill="#0D2A3A" stroke="#A78BFA" stroke-opacity=".42"/><text x="20" y="29" class="label">03 · 理解</text><text x="20" y="59" class="card-title">研究竞品用户</text><text x="20" y="82" class="question">用户为什么满意、抱怨、留下或切换？</text>
      <g transform="translate(20 102)"><rect width="91" height="91" rx="14" fill="#152F45" stroke="#64748B"/><rect x="14" y="15" width="63" height="12" rx="6" fill="#94A3B8"/><rect x="14" y="37" width="52" height="7" rx="3.5" fill="#526E82"/><rect x="14" y="52" width="61" height="7" rx="3.5" fill="#526E82"/><text x="45" y="78" text-anchor="middle" fill="#CBD5E1" font-size="10" font-weight="700">竞品</text><g transform="translate(111 5)"><circle cx="28" cy="19" r="11" fill="#38BDF8"/><path d="M8 57C10 40 18 34 28 34C38 34 46 40 48 57" fill="#164E63"/><text x="28" y="74" text-anchor="middle" class="micro">留下</text></g><g transform="translate(179 5)"><circle cx="28" cy="19" r="11" fill="#FB7185"/><path d="M8 57C10 40 18 34 28 34C38 34 46 40 48 57" fill="#71344A"/><text x="28" y="74" text-anchor="middle" class="micro">抱怨</text></g><g transform="translate(247 5)"><circle cx="28" cy="19" r="11" fill="#5EEAD4"/><path d="M8 57C10 40 18 34 28 34C38 34 46 40 48 57" fill="#155E5A"/><text x="28" y="74" text-anchor="middle" class="micro">切换</text></g><path d="M97 45H113" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/><path d="M227 88H324" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round"/><path d="M317 81L324 88L317 95" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <rect x="20" y="221" width="336" height="1" fill="#35606A"/><text x="20" y="235" class="decision">你会得到：可切入的用户问题</text>
    </g>

    <g transform="translate(248 418)" filter="url(#shadow)">
      <rect width="376" height="240" rx="22" fill="#0D2A3A" stroke="#FBBF24" stroke-opacity=".42"/><text x="20" y="29" class="label">04 · 创作</text><text x="20" y="59" class="card-title">寻找内容机会</text><text x="20" y="82" class="question">大家反复在问什么，下一篇先讲什么？</text>
      <g transform="translate(20 102)"><rect width="127" height="29" rx="10" fill="#153B49"/><text x="13" y="19" class="micro">“具体怎么做？”</text><rect y="39" width="127" height="29" rx="10" fill="#153B49"/><text x="13" y="58" class="micro">“这值得买吗？”</text><rect y="78" width="127" height="29" rx="10" fill="#153B49"/><text x="13" y="97" class="micro">“哪里容易出错？”</text><path d="M139 54H166M159 47L166 54L159 61" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(177 0)"><rect width="148" height="103" rx="14" fill="#FFF4D8"/><rect x="14" y="14" width="72" height="8" rx="4" fill="#D3A64F"/><rect x="14" y="31" width="119" height="6" rx="3" fill="#E2C582"/><rect x="14" y="43" width="97" height="6" rx="3" fill="#E2C582"/><rect x="14" y="62" width="120" height="26" rx="8" fill="#F8DF9E"/><text x="74" y="79" text-anchor="middle" fill="#6B4F18" font-size="10" font-weight="700">切入角度 · 证据 · 下一步</text></g></g>
      <rect x="20" y="221" width="336" height="1" fill="#35606A"/><text x="20" y="235" class="decision">你会得到：值得测试的内容方向</text>
    </g>

    <g transform="translate(656 418)" filter="url(#shadow)">
      <rect width="376" height="240" rx="22" fill="#0D2A3A" stroke="#FB7185" stroke-opacity=".42"/><text x="20" y="29" class="label">05 · 验证</text><text x="20" y="59" class="card-title">验证产品需求</text><text x="20" y="82" class="question">用户真的需要它吗？最小先验证什么？</text>
      <g transform="translate(20 102)"><rect width="124" height="104" rx="14" fill="#153B49"/><text x="14" y="21" class="micro" font-weight="700">当前做法</text><circle cx="17" cy="39" r="4" fill="#38BDF8"/><rect x="29" y="35" width="76" height="7" rx="3.5" fill="#6497A7"/><circle cx="17" cy="59" r="4" fill="#FBBF24"/><rect x="29" y="55" width="64" height="7" rx="3.5" fill="#6497A7"/><circle cx="17" cy="79" r="4" fill="#FB7185"/><rect x="29" y="75" width="82" height="7" rx="3.5" fill="#6497A7"/><text x="14" y="96" fill="#FCA5A5" font-size="9">任务 · 凑合办法 · 麻烦</text><path d="M136 52H164M157 45L164 52L157 59" stroke="#FB7185" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="176" width="149" height="104" rx="14" fill="#E8F7F3"/><rect x="190" y="14" width="121" height="23" rx="8" fill="#BFE9DF"/><text x="250" y="29" text-anchor="middle" fill="#164E52" font-size="10" font-weight="700">最小验证方案</text><text x="190" y="55" fill="#47757A" font-size="10">先解决一个问题</text><text x="190" y="72" fill="#47757A" font-size="10">一个有效标准</text><text x="190" y="89" fill="#47757A" font-size="10">一个停止条件</text></g>
      <rect x="20" y="221" width="336" height="1" fill="#35606A"/><text x="20" y="235" class="decision">你会得到：最小需求验证方案</text>
    </g>

    <g transform="translate(390 703)"><circle cx="7" cy="7" r="7" fill="#38BDF8"/><text x="23" y="11" fill="#B9D7DB" font-size="12">平台上的真实讨论</text><path d="M132 7H174M167 1L174 7L167 13" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="196" cy="7" r="7" fill="#5EEAD4"/><text x="212" y="11" fill="#B9D7DB" font-size="12">核对原文与反例</text><path d="M312 7H354M347 1L354 7L347 13" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="376" cy="7" r="7" fill="#FBBF24"/><text x="392" y="11" fill="#B9D7DB" font-size="12">下一步行动建议</text></g>
    <text x="640" y="742" text-anchor="middle" fill="#729FA7" font-size="10">流程示意 · 不含真实平台数据</text>
  </g>
</svg>
