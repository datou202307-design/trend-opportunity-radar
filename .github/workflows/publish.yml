name: Publish trend opportunity radar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand validated source
        shell: bash
        run: |
          base64 --decode > source.zip <<'PAYLOAD'
          
          PAYLOAD
          unzip -o source.zip
          rm source.zip
          rm -f .github/workflows/publish.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish trend opportunity radar v0.1 candidate"
          git push
