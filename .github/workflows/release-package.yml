name: Release Skill package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit public files
        run: python tools/audit_open_source_release.py
      - name: Validate Skill structure
        run: python tools/validate_skill.py skills/trend-opportunity-radar
      - name: Run tests
        run: python -m unittest discover -s skills/trend-opportunity-radar/tests -v
      - name: Build deterministic release assets
        run: python tools/package_skill_release.py --version "${{ github.event.release.tag_name }}" --output-dir dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
